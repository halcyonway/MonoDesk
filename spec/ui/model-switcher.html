<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ModelPicker Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #main-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 800px;
    margin: 0 auto;
    width: 100%;
    background: #fff;
    border-left: 1px solid #e0e0e0;
    border-right: 1px solid #e0e0e0;
  }

  #composer-wrap {
    border-top: 1px solid #e8e8e8;
    padding: 10px 16px 12px;
  }
  #composer {
    border: 1px solid #d0d0d0;
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .composer-main textarea {
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.5;
    font-family: inherit;
    min-height: 44px;
    max-height: 140px;
    overflow-y: auto;
  }
  .composer-foot {
    display: flex;
    align-items: center;
    padding: 6px 10px;
    gap: 8px;
    background: #fafafa;
    border-top: 1px solid #f0f0f0;
  }
  .attach-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    color: #888;
    border-radius: 4px;
    display: flex;
    align-items: center;
  }
  .attach-btn:hover { background: #f0f0f0; color: #555; }

  /* ===== ModelPicker（自定义下拉）===== */
  .model-picker { position: relative; flex: none; }
  .model-picker-btn {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    font-family: ui-monospace, monospace; font-size: 11.5px; color: #555;
    background: #fff; border: 1px solid #d0d0d0; border-radius: 7px;
    padding: 3px 8px; cursor: pointer;
    max-width: 220px;
    transition: border-color 0.12s, color 0.12s;
  }
  .model-picker-btn:hover, .model-picker.open .model-picker-btn {
    border-color: #1a73e8; color: #1a1a1a;
  }
  .model-picker-btn span {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .model-picker-btn svg { flex: none; opacity: 0.6; transition: transform 0.15s; }
  .model-picker.open .model-picker-btn svg { transform: rotate(180deg); }

  .model-picker-menu {
    position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 50;
    min-width: 200px; max-width: 300px;
    background: #fff; border: 1px solid #d0d0d0; border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
    padding: 4px;
    animation: picker-in 0.12s ease-out;
  }
  @keyframes picker-in {
    from { opacity: 0; transform: translateY(3px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .model-picker-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 7px 10px; border-radius: 7px;
    font-family: ui-monospace, monospace; font-size: 11.5px; color: #555;
    cursor: pointer; white-space: nowrap;
  }
  .model-picker-item:hover { background: #f5f5f5; color: #1a1a1a; }
  .model-picker-item.selected {
    color: #1a73e8; background: rgba(26, 115, 232, 0.08); font-weight: 500;
  }
  .model-picker-item .mp-check { flex: none; font-size: 11px; }
  .model-picker-item small {
    color: #888; font-weight: 400; margin-left: 5px; font-size: 10.5px;
  }
  .model-picker-sep {
    height: 1px; background: #e0e0e0; margin: 4px 6px;
  }
</style>
</head>
<body>

<div id="main-col">
  <div style="padding:14px 16px;background:#fffde7;border-bottom:1px solid #ffe082;font-size:12px;color:#7c6000;">
    <strong>提示：</strong>对话框左下角的 <strong>模型选择器</strong>，
    可在 <code>default / openai / claude / gemini</code> 之间切换。
    选中后下一个请求带 <code>meta.model_provider</code> → LlmProxy 解析真实凭证。
    真实模型名（Trace 抽屉 / StatusBar）随每轮 metric 帧刷新。
  </div>

  <div id="composer-wrap" style="margin:24px 16px;">
    <div id="composer">
      <div class="composer-main">
        <textarea rows="2" placeholder="Message MonoX… (paste or drop images)"></textarea>
      </div>
      <div class="composer-foot">
        <!-- ModelPicker -->
        <div class="model-picker" id="modelPicker">
          <button class="model-picker-btn" onclick="toggleDropdown()">
            <span id="currentModelLabel">default (gpt-4o-mini)</span>
            <svg viewBox="0 0 10 6" width="9" height="6" fill="currentColor">
              <path d="M0 0l5 6 5-6z" />
            </svg>
          </button>
          <div class="model-picker-menu" id="modelMenu" style="display:none;">
            <div class="model-picker-item selected" data-provider="" onclick="selectProvider('')">
              <span>default <small id="defaultHint">gpt-4o-mini</small></span>
              <span class="mp-check">✓</span>
            </div>
            <div class="model-picker-sep"></div>
            <div class="model-picker-item" data-provider="openai" onclick="selectProvider('openai')">
              <span>openai</span>
              <span class="mp-check">✓</span>
            </div>
            <div class="model-picker-item" data-provider="claude" onclick="selectProvider('claude')">
              <span>claude</span>
              <span class="mp-check">✓</span>
            </div>
            <div class="model-picker-item" data-provider="gemini" onclick="selectProvider('gemini')">
              <span>gemini</span>
              <span class="mp-check">✓</span>
            </div>
          </div>
        </div>

        <button class="attach-btn" title="Attach image">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
        </button>

        <div style="flex:1"></div>

        <div style="font-size:11px;color:#aaa;">ready</div>

        <button id="send" style="background:#1a73e8;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;color:#fff;font-size:13px;">
          Send
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  function toggleDropdown() {
    const el = document.getElementById('modelPicker');
    const menu = document.getElementById('modelMenu');
    const open = el.classList.toggle('open');
    menu.style.display = open ? 'block' : 'none';
  }
  // 点击外部关闭
  document.addEventListener('mousedown', (e) => {
    const el = document.getElementById('modelPicker');
    if (!el.contains(e.target)) {
      el.classList.remove('open');
      document.getElementById('modelMenu').style.display = 'none';
    }
  });
  function selectProvider(name) {
    document.querySelectorAll('.model-picker-item').forEach(item => {
      item.classList.toggle('selected', item.dataset.provider === name);
    });
    document.getElementById('currentModelLabel').textContent =
      name ? name : ('default (' + (document.getElementById('defaultHint').textContent || '') + ')');
    document.getElementById('modelPicker').classList.remove('open');
    document.getElementById('modelMenu').style.display = 'none';
  }
</script>

</body>
</html>
